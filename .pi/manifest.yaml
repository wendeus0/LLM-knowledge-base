version: 1
kind: pi-project-manifest

project:
  name: kb
  description: LLM-powered knowledge base engine
  primary_language: python
  runtime: python>=3.11
  purpose: >-
    Engine de knowledge base mantida por LLM para ingestão,
    compilação em wiki markdown, busca, Q&A e healing.

paths:
  package: kb/
  tests: tests/
  examples: examples/
  user_data: <KB_DATA_DIR>/
  pi: .pi/
  agent_context:
    - AGENTS.md
    - CLAUDE.md

commands:
  setup:
    - pip install -e .
    - pip install -e ".[llm]"
    - pip install -e ".[dev]"
  test: pytest -q
  test_unit: pytest -q tests/unit
  lint: ruff check kb
  run_compile: kb compile
  run_qa: kb qa "<pergunta>"
  run_file_back: kb qa "<pergunta>" --file-back
  run_search: kb search "<termo>"
  run_heal: kb heal --n 10
  run_bench: kb bench
  run_index_build: kb index build
  run_index_status: kb index status

conventions:
  wiki_writes: "Não editar a wiki manualmente; preferir CLI/LLM do projeto no corpus do usuário."
  file_back: "Respostas arquivadas vão para outputs/ por padrão; write é local e --commit ativa o versionamento (ADR-0016)."
  testing: "Priorizar testes offline/mocados quando houver dependência externa; a suíte desliga refresh de índice e rerank."
  retrieval: "Mudança de ranking passa por kb bench antes de ser adotada — medição, não plausibilidade (ADR-0017)."
  local_servers: "qa em qualidade plena depende de embeddings (:1234) e rerank (:8081); ausentes, degrada para lexical com aviso."
  source_of_truth: "Manifesto para estrutura curta; AGENTS.md e CLAUDE.md para contexto narrativo."

agent_context:
  primary_files:
    - AGENTS.md
    - CLAUDE.md
  usage:
    - Ler este manifesto para visão rápida do projeto.
    - Ler AGENTS.md para domínio, arquitetura e convenções.
    - Ler CLAUDE.md para onboarding e fluxo operacional.

future_integrations:
  opencode:
    status: planned
    note: >-
      O esquema deve permanecer simples para futura comparação e adaptação
      ao OpenCode, evitando chaves acopladas a uma ferramenta específica.

validation:
  success_criteria:
    - Novo membro do time consegue localizar contexto, comandos e diretórios importantes em poucos minutos.
    - O manifesto permanece curto e complementar a AGENTS.md/CLAUDE.md.
    - O conteúdo é facilmente serializável/mapeável para outro formato no futuro.

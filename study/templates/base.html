<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>!function(){var theme=localStorage.getItem('study-theme');document.documentElement.dataset.theme=theme==='dark'?'dark':'light'}()</script>
  <link rel="stylesheet" href="{{ url_for('static', path='study.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="{{ url_for('static', path='study.js') }}" defer></script>
  <title>{% block title %}Estudos{% endblock %}</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Estudos</a>
    <nav aria-label="Principal"><a href="/">Início</a></nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Alternar tema">Tema</button>
  </header>
  <main class="page {% block page_class %}{% endblock %}">
    {% block sidebar %}{% endblock %}
    <section class="content">{% block content %}{% endblock %}</section>
  </main>
</body>
</html>
